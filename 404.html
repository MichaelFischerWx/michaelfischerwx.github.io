<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Michael S. Fischer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --ink:#0f1720; --ink-2:#4b5563; --ink-3:#5f6b78; --line:#cbd5d0; --brand:#005030; --brand-hi:#00714a; --on-brand:#ffffff; --accent:#f47321; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a0e14; --ink:#e7ecea; --ink-2:#a6b2bd; --ink-3:#7f8b98; --line:#33404f; --brand:#4a9b6e; --brand-hi:#6db993; --on-brand:#06130d; }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.5rem;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; }
  .rule { width: 46px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--brand), var(--accent)); margin-bottom: 1.4rem; }
  .eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-hi); margin-bottom: .85rem; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.18; letter-spacing: -.02em; margin-bottom: 1rem; }
  p { color: var(--ink-2); margin-bottom: 1.8rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .8rem; }
  a.btn { display: inline-flex; align-items: center; padding: .72rem 1.4rem; border-radius: 10px; font-size: .95rem; font-weight: 600; text-decoration: none; border: 1px solid transparent; }
  a.primary { background: var(--brand); color: var(--on-brand); }
  a.ghost { color: var(--ink); border-color: var(--line); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="rule"></div>
  <p class="eyebrow">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you requested does not exist or has moved.</p>
  <div class="actions">
    <a class="btn primary" href="/">Michael S. Fischer — home</a>
    <a class="btn ghost" href="https://tcatlas.org">TC-ATLAS</a>
  </div>
</main>
</body>
</html>
